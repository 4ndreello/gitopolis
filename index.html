<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo City</title>
<style>
:root { --ink: #f2f6fa; --ink-2: #cbd7e2; --accent: #ffc76b; --bad: #ff8b7f; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: #0d141c; color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; -webkit-font-smoothing: antialiased;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#cv:active { cursor: grabbing; }
#hud {
  position: fixed; top: 8px; left: 10px;
  display: flex; align-items: center; gap: 10px;
  pointer-events: none;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  font-variant-numeric: tabular-nums;
}
/* the dot is generated, never written in the markup: a hand-placed separator
   outlives the thing it separates, so every rule that hides an item would have
   to hide a sibling too. as a pseudo-element it leaves with its own item. */
#hud > *:not(:first-child)::before {
  content: "·";
  color: var(--ink-2); opacity: 0.5;
  margin-right: 10px;
}
/* the hud drops items by priority as the window narrows — this thing is meant
   to live in a picture-in-picture the size of a business card. repo and clock
   never go: which city this is, and that it is still alive. */
@media (max-width: 460px) { #r-perf { display: none; } }
@media (max-width: 340px) { #r-branch { display: none; } }
/* a native <select multiple> is the whole picker: keyboard accessible, four
   rows visible, no widget to maintain. it is the only listbox in the hud, so it
   is styled to look like the rest of the text rather than like a form control.
   chromium paints a selected option's background itself and ignores
   `background-color` on it — the gradient is the one declaration it honours. */
#repo {
  pointer-events: auto; align-self: flex-start;
  background: rgba(19, 29, 39, 0.72);
  border: 1px solid rgba(203, 215, 226, 0.14); border-radius: 3px;
  padding: 2px 3px;
  color: var(--ink); font: inherit; font-weight: 600;
  cursor: pointer; outline: none;
  max-width: 150px; scrollbar-width: thin;
}
#repo option { background: #131d27; color: var(--ink); padding: 0 3px; }
#repo option:checked {
  background: linear-gradient(0deg, var(--accent), var(--accent));
  color: #0d141c;
}
#r-branch { color: var(--accent); }
#r-clock { font-weight: 600; }
#r-status { color: var(--bad); }
#r-status[data-ok="ok"] { display: none; }
#r-status[data-ok="busy"] { color: var(--accent); }
#r-perf { color: var(--ink-2); }
/* font/margin are not inherited by <pre>: the UA sheet resets both. z-index
   must clear #boot (5) or the panel hides behind the curtain during the cold
   open, which is the one moment the ingest feed is interesting. the explicit
   [hidden] rule is needed because an author `display` beats the UA one. */
#dbg {
  position: fixed; top: 8px; right: 10px; z-index: 6;
  margin: 0; font: inherit; pointer-events: none;
  color: var(--ink-2); line-height: 1.45;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  font-variant-numeric: tabular-nums;
}
#dbg[hidden] { display: none; }
/* the cheat panel is the clickable half of window.__time/__toggle. it lives in
   the opposite corner from #dbg on purpose: #dbg has no fixed height, so
   stacking them would make the sliders jump every time a log line lands.
   pointer-events auto here and nowhere else in the hud — a drag that starts on
   a slider must not reach OrbitControls. */
#cheat {
  position: fixed; right: 10px; bottom: 8px; z-index: 6;
  width: 216px; padding: 8px 10px;
  background: rgba(13, 20, 28, 0.82); border: 1px solid rgba(203, 215, 226, 0.14);
  border-radius: 4px;
  color: var(--ink-2); line-height: 1.5;
  pointer-events: auto; user-select: none;
  font-variant-numeric: tabular-nums;
}
#cheat[hidden] { display: none; }
#cheat h4 { margin: 0 0 6px; font: inherit; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
#cheat .row { display: grid; grid-template-columns: 52px 1fr 34px; align-items: center; gap: 6px; }
#cheat .row > b { font-weight: 400; }
/* the auto flag is the whole model: a knob is either following the world clock
   or overriding it, and the value column says which without a second control */
#cheat .row > i { font-style: normal; text-align: right; cursor: pointer; }
#cheat .row > i.auto { color: rgba(203, 215, 226, 0.42); }
#cheat input[type=range] { width: 100%; height: 12px; margin: 0; accent-color: var(--accent); cursor: pointer; }
#cheat .togs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
#cheat .togs > button {
  flex: 1 0 auto; padding: 2px 6px;
  background: transparent; border: 1px solid rgba(203, 215, 226, 0.2); border-radius: 3px;
  color: var(--ink-2); font: inherit; cursor: pointer;
}
#cheat .togs > button[data-off] { color: rgba(203, 215, 226, 0.35); border-color: rgba(203, 215, 226, 0.1); }
/* covers the canvas while the city rises, so only the finished skyline shows */
#boot {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center; gap: 14px; align-content: center;
  background: #0d141c; color: var(--accent);
  letter-spacing: 0.12em; text-transform: uppercase;
  transition: opacity 0.7s ease;
}
#boot.done { opacity: 0; pointer-events: none; }
#boot-bar { width: 180px; height: 2px; background: rgba(255, 199, 107, 0.18); }
#boot-bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s linear; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
<select id="repo" multiple size="4" title="até 4 repos"></select>
<span id="r-branch">…</span>
<b id="r-clock">00:00</b>
<span id="r-perf">--</span>
<span id="r-status" data-ok="busy">conectando…</span>
</div>
<pre id="dbg" hidden></pre>
<div id="cheat" hidden></div>
<div id="boot">
<span id="boot-txt">conectando…</span>
<span id="boot-bar"><i></i></span>
</div>
<script src="bundle.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repo City</title>
<style>
:root {
  --bg: #0d141c; --panel: #131d27; --line: #25333e;
  --ink: #dbe4ed; --ink-2: #a5b5c5; --muted: #70818e;
  --accent: #e8a13a; --ok: #4fb286; --bad: #d2564b;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
#bar {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 9px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  color: var(--muted); font-variant-numeric: tabular-nums; flex: none;
}
#bar b { color: var(--ink); font-weight: 600; }
#bar .grow { flex: 1; }
#r-status[data-ok="1"] { color: var(--ok); }
#r-status[data-ok="0"] { color: var(--bad); }
#r-branch { color: var(--accent); }
label.sl { display: flex; align-items: center; gap: 7px; color: var(--ink-2); }
label.sl input { width: 110px; accent-color: var(--accent); }
#cv { flex: 1; display: block; width: 100%; cursor: grab; }
#cv:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="bar">
<span><b id="r-repo">…</b></span>
<span>branch <b id="r-branch">…</b></span>
<span>arquivos <b id="r-files">0</b></span>
<span>distritos <b id="r-dist">0</b></span>
<span>obras <b id="r-dirty">0</b></span>
<span>fps <b id="r-fps">0</b></span>
<span class="grow"></span>
<span id="r-status" data-ok="0">conectando…</span>
<label class="sl">ângulo <input type="range" id="angle" min="25" max="78" value="52"></label>
<label class="sl">hora <input type="range" id="time" min="0" max="1" step="0.005" value="0.42"></label>
</div>
<canvas id="cv"></canvas>
<script src="bundle.js"></script>
</body>
</html>
